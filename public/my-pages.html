<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Landing Pages · Find My Shop</title>
<style>
  :root {
    --bg: #fdfaf6;
    --ink: #222;
    --muted: #6b6b6b;
    --accent: #d5641c;
    --card-bg: #ffffff;
    --border: #eee2d6;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 2rem 1.5rem 1rem;
    text-align: center;
  }
  header h1 { margin: 0 0 .25rem; font-size: 1.8rem; }
  header p { margin: 0; color: var(--muted); }
  #status {
    text-align: center;
    color: var(--muted);
    padding: 0 1rem 1rem;
  }
  #status.error { color: var(--error); }
  .back-link {
    display: block;
    text-align: center;
    color: var(--accent);
    text-decoration: none;
    font-size: .9rem;
    margin-bottom: 1rem;
  }
  .pages-grid {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    display: grid;
    gap: 1rem;
  }
  .page-card {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem;
  }
  .page-card img {
    width: 72px;
    height: 72px;
    object-fit: cover;
    border-radius: 8px;
    background: #f0ece6;
    flex: 0 0 auto;
  }
  .page-card .info {
    flex: 1;
    min-width: 0;
  }
  .page-card .info h3 {
    margin: 0 0 .2rem;
    font-size: 1rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .page-card .info .date {
    color: var(--muted);
    font-size: .8rem;
  }
  .page-card .actions {
    display: flex;
    gap: .5rem;
    flex: 0 0 auto;
  }
  .page-card .actions a,
  .page-card .actions button {
    padding: .45rem .9rem;
    border-radius: 6px;
    font-size: .85rem;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid var(--border);
    background: white;
    color: var(--ink);
    font-family: inherit;
  }
  .page-card .actions a.primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .page-card.unavailable .info h3 {
    color: var(--muted);
  }
  .share-panel {
    flex: 1 1 100%;
    margin-top: .75rem;
    padding-top: .75rem;
    border-top: 1px solid var(--border);
    display: grid;
    gap: 1rem;
  }
  .share-panel[hidden] {
    display: none;
  }
  .share-platform h4 {
    margin: 0 0 .4rem;
    font-size: .85rem;
  }
  .share-caption {
    width: 100%;
    min-height: 4.5rem;
    padding: .5rem .6rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: .85rem;
    resize: vertical;
    box-sizing: border-box;
  }
  .share-hint {
    margin: .4rem 0 0;
    font-size: .78rem;
    color: var(--muted);
  }
  .share-actions {
    display: flex;
    gap: .5rem;
    margin-top: .5rem;
  }
</style>
</head>
<body>
  <a id="logout-link" href="#" style="display:none; position:fixed; top:1rem; right:1.25rem; font-size:.85rem; color:var(--muted); text-decoration:none;">Log out</a>

  <header>
    <h1>My Landing Pages</h1>
    <p>Every landing page you've created, with links you can share or revisit anytime.</p>
  </header>

  <a class="back-link" href="/index.html">← Back to shop search</a>
  <p id="status">Loading your pages…</p>
  <div class="pages-grid" id="pages-grid" style="display:none;"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    import { buildPinterestShareUrl, buildFacebookShareUrl, formatCaptionForCopy, getSocialPost } from './shareLinks.js';

    const status = document.getElementById('status');
    const grid = document.getElementById('pages-grid');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function renderSharePanel(row) {
      const { listing, copy } = row.content;
      // No sharable copy (e.g. a row saved before captions existed) -- render
      // nothing rather than let getSocialPost's `copy.socialPosts` access throw
      // on a null/undefined `copy` and break rendering of every card.
      if (!copy) return '';
      const pageUrl = new URL(`/p/${row.id}`, window.location.origin).href;
      // Prefer the full-resolution image for sharing (vs. renderCard's 570xN
      // thumbnail below) since social platforms display it much larger.
      const imageUrl = listing?.images?.[0]?.url_fullxfull || listing?.images?.[0]?.url_570xN || '';

      const platforms = [
        { key: 'pinterest', label: 'Pinterest' },
        { key: 'facebook', label: 'Facebook' },
        { key: 'instagram', label: 'Instagram' },
      ];

      return `
        <div class="share-panel" hidden>
          ${platforms.map(({ key, label }) => {
            const post = getSocialPost(copy, key);
            const caption = formatCaptionForCopy(post);
            let actionsHtml = `<button type="button" class="copy-caption-btn" data-platform="${key}">Copy caption</button>`;
            let hint = '';
            if (key === 'pinterest') {
              const shareUrl = buildPinterestShareUrl({ pageUrl, imageUrl, socialPost: post });
              actionsHtml += `<button type="button" class="platform-share-btn" data-url="${escapeHtml(shareUrl)}">Share to Pinterest</button>`;
            } else if (key === 'facebook') {
              const shareUrl = buildFacebookShareUrl({ pageUrl });
              actionsHtml += `<button type="button" class="platform-share-btn" data-url="${escapeHtml(shareUrl)}">Share to Facebook</button>`;
              hint = `<p class="share-hint">Facebook won't let us fill this in for you — click Share, then paste this caption into the post box that opens.</p>`;
            } else {
              if (imageUrl) {
                actionsHtml += `<a class="platform-share-btn" href="${escapeHtml(imageUrl)}" target="_blank" rel="noopener noreferrer">Open image</a>`;
              }
              hint = `<p class="share-hint">Instagram doesn't support posting from a browser — copy the caption, save the image, then post from the Instagram app.</p>`;
            }
            return `
              <div class="share-platform">
                <h4>${label}</h4>
                <textarea class="share-caption" data-platform="${key}">${escapeHtml(caption)}</textarea>
                ${hint}
                <div class="share-actions">${actionsHtml}</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderCard(row) {
      const created = new Date(row.created_at).toLocaleDateString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
      });

      if (!row.content) {
        return `
          <div class="page-card unavailable">
            <div class="info">
              <h3>Early test page — no link available</h3>
              <div class="date">Created ${created}</div>
            </div>
          </div>
        `;
      }

      const { listing, copy } = row.content;
      const title = copy?.headline || listing?.title || 'Untitled page';
      const image = listing?.images?.[0]?.url_570xN || listing?.images?.[0]?.url_fullxfull || '';
      const url = `/p/${row.id}`;

      return `
        <div class="page-card">
          ${image ? `<img src="${escapeHtml(image)}" alt="" />` : ''}
          <div class="info">
            <h3>${escapeHtml(title)}</h3>
            <div class="date">Created ${created}</div>
          </div>
          <div class="actions">
            <button type="button" class="copy-btn" data-url="${escapeHtml(url)}">Copy link</button>
            ${copy ? '<button type="button" class="share-toggle-btn">Share</button>' : ''}
            <a class="primary" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">View page →</a>
          </div>
          ${copy ? renderSharePanel(row) : ''}
        </div>
      `;
    }

    async function init() {
      const configRes = await fetch('/api/config');
      if (!configRes.ok) {
        status.textContent = 'This page is not available — missing site configuration.';
        status.className = 'error';
        return;
      }
      const { supabaseUrl, supabaseAnonKey } = await configRes.json();
      // Reads from either storage since "Remember me" on the login page may have
      // put the session in sessionStorage instead of the default localStorage.
      const supabase = createClient(supabaseUrl, supabaseAnonKey, {
        auth: {
          storage: {
            getItem: (key) => localStorage.getItem(key) ?? sessionStorage.getItem(key),
            setItem: (key, value) => localStorage.setItem(key, value),
            removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); },
          },
        },
      });

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '/login.html';
        return;
      }

      const logoutLink = document.getElementById('logout-link');
      logoutLink.style.display = 'block';
      logoutLink.addEventListener('click', async (e) => {
        e.preventDefault();
        await supabase.auth.signOut();
        window.location.href = '/login.html';
      });

      // RLS ("Users can view their own landing pages") restricts this to the
      // caller's own rows -- no server endpoint needed for a read this simple.
      const { data: rows, error } = await supabase
        .from('landing_pages')
        .select('id, created_at, content')
        .order('created_at', { ascending: false });

      if (error) {
        status.textContent = 'Could not load your pages: ' + error.message;
        status.className = 'error';
        return;
      }

      if (!rows.length) {
        status.textContent = "You haven't created any landing pages yet.";
        return;
      }

      status.style.display = 'none';
      grid.style.display = 'grid';
      grid.innerHTML = rows.map(renderCard).join('');

      grid.addEventListener('click', async (e) => {
        const copyLinkBtn = e.target.closest('.copy-btn');
        if (copyLinkBtn) {
          const original = copyLinkBtn.textContent;
          try {
            await navigator.clipboard.writeText(new URL(copyLinkBtn.dataset.url, window.location.origin).href);
            copyLinkBtn.textContent = 'Copied!';
          } catch {
            copyLinkBtn.textContent = 'Copy failed';
          }
          setTimeout(() => { copyLinkBtn.textContent = original; }, 1500);
          return;
        }

        const shareToggleBtn = e.target.closest('.share-toggle-btn');
        if (shareToggleBtn) {
          const panel = shareToggleBtn.closest('.page-card').querySelector('.share-panel');
          panel.hidden = !panel.hidden;
          return;
        }

        const copyCaptionBtn = e.target.closest('.copy-caption-btn');
        if (copyCaptionBtn) {
          const platform = copyCaptionBtn.dataset.platform;
          const textarea = copyCaptionBtn.closest('.share-platform').querySelector(`textarea[data-platform="${platform}"]`);
          const original = copyCaptionBtn.textContent;
          try {
            await navigator.clipboard.writeText(textarea.value);
            copyCaptionBtn.textContent = 'Copied!';
          } catch {
            copyCaptionBtn.textContent = 'Copy failed';
          }
          setTimeout(() => { copyCaptionBtn.textContent = original; }, 1500);
          return;
        }

        const platformShareBtn = e.target.closest('.platform-share-btn[data-url]');
        if (platformShareBtn) {
          const popup = window.open(platformShareBtn.dataset.url, '_blank', 'width=750,height=550');
          if (!popup) {
            alert('Please allow pop-ups for this site to open the share dialog.');
          }
          return;
        }
      });
    }

    init();
  </script>
</body>
</html>
