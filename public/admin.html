<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Etsy Shop Viewer</title>
<style>
  :root {
    --bg: #fdfaf6;
    --ink: #222;
    --muted: #6b6b6b;
    --accent: #d5641c;
    --card-bg: #ffffff;
    --border: #eee2d6;
    --error: #b3261e;
    --success: #1a7a35;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 2rem 1.5rem 1rem;
    text-align: center;
  }
  header h1 { margin: 0 0 .25rem; font-size: 1.8rem; }
  header p { margin: 0; color: var(--muted); }
  #status {
    text-align: center;
    color: var(--muted);
    padding: 0 1rem 1rem;
  }
  #status.error { color: var(--error); }
  #status.success { color: var(--success); }
  .table-wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    text-align: left;
    padding: .7rem .9rem;
    border-bottom: 1px solid var(--border);
    font-size: .9rem;
    white-space: nowrap;
  }
  th { color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  select {
    padding: .35rem .5rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: .85rem;
  }
  .badge {
    display: inline-block;
    padding: .2rem .55rem;
    border-radius: 999px;
    font-size: .78rem;
    font-weight: 600;
  }
  .badge-requested { background: #fff3d6; color: #8a6100; }
  .badge-approved { background: #dcf3e3; color: var(--success); }
  .badge-declined { background: #fbe0de; color: var(--error); }
  .actions { display: flex; gap: .4rem; }
  button {
    padding: .4rem .75rem;
    border: none;
    border-radius: 6px;
    font-size: .82rem;
    cursor: pointer;
  }
  .btn-approve { background: var(--success); color: white; }
  .btn-decline { background: var(--error); color: white; }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>Admin</h1>
    <p>Manage user access for LaunchNestAI</p>
  </header>

  <p id="status">Loading…</p>

  <div class="table-wrap">
    <table id="profiles-table" style="display:none">
      <thead>
        <tr>
          <th>Email</th>
          <th>Name</th>
          <th>Company</th>
          <th>Role</th>
          <th>Status</th>
          <th>Pages</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="profiles-body"></tbody>
    </table>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const statusEl = document.getElementById('status');
    const table = document.getElementById('profiles-table');
    const tbody = document.getElementById('profiles-body');

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = kind || '';
    }

    const STATUS_BADGE = { requested: 'badge-requested', approved: 'badge-approved', declined: 'badge-declined' };

    function renderRow(profile, accessToken) {
      const tr = document.createElement('tr');
      tr.dataset.id = profile.id;

      const roleSelect = `
        <select class="role-select">
          <option value="user" ${profile.role === 'user' ? 'selected' : ''}>user</option>
          <option value="admin" ${profile.role === 'admin' ? 'selected' : ''}>admin</option>
        </select>`;

      tr.innerHTML = `
        <td>${profile.email}</td>
        <td>${profile.full_name ?? ''}</td>
        <td>${profile.company_name ?? ''}</td>
        <td>${roleSelect}</td>
        <td><span class="badge ${STATUS_BADGE[profile.status] ?? ''}">${profile.status}</span></td>
        <td>${profile.page_allowance}</td>
        <td class="actions">
          <button class="btn-approve" ${profile.status === 'approved' ? 'disabled' : ''}>Approve</button>
          <button class="btn-decline" ${profile.status === 'declined' ? 'disabled' : ''}>Decline</button>
          <input class="grant-amount" type="number" min="1" value="3" style="width:3.5rem; padding:.35rem; border:1px solid var(--border); border-radius:6px; font-size:.85rem;" />
          <button class="btn-grant">Grant Pages</button>
        </td>
      `;

      async function patch(body) {
        const res = await fetch(`/api/admin/profiles/${profile.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          setStatus(data.error || 'Something went wrong.', 'error');
          return;
        }
        tr.replaceWith(renderRow(data.profile, accessToken));
      }

      async function grantPages() {
        const amount = Number(tr.querySelector('.grant-amount').value) || 3;
        const res = await fetch(`/api/admin/profiles/${profile.id}/grant-pages`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}` },
          body: JSON.stringify({ amount }),
        });
        const data = await res.json();
        if (!res.ok) {
          setStatus(data.error || 'Something went wrong.', 'error');
          return;
        }
        setStatus(`Granted ${amount} page(s) to ${profile.email} (new total: ${data.page_allowance}).`, 'success');
        tr.replaceWith(renderRow(data.profile, accessToken));
      }

      tr.querySelector('.btn-approve').addEventListener('click', () => patch({ status: 'approved' }));
      tr.querySelector('.btn-decline').addEventListener('click', () => patch({ status: 'declined' }));
      tr.querySelector('.role-select').addEventListener('change', (e) => patch({ role: e.target.value }));
      tr.querySelector('.btn-grant').addEventListener('click', grantPages);

      return tr;
    }

    async function init() {
      const configRes = await fetch('/api/config');
      if (!configRes.ok) {
        setStatus('Admin panel is not available — the site is missing its Supabase configuration.', 'error');
        return;
      }
      const { supabaseUrl, supabaseAnonKey } = await configRes.json();
      const supabase = createClient(supabaseUrl, supabaseAnonKey);

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '/login.html';
        return;
      }

      const res = await fetch('/api/admin/profiles', {
        headers: { Authorization: `Bearer ${session.access_token}` },
      });
      const data = await res.json();

      if (res.status === 403) {
        setStatus("You don't have access to this page.", 'error');
        return;
      }
      if (!res.ok) {
        setStatus(data.error || 'Something went wrong.', 'error');
        return;
      }

      setStatus('');
      table.style.display = 'table';
      for (const profile of data.profiles) {
        tbody.appendChild(renderRow(profile, session.access_token));
      }
    }

    init();
  </script>
</body>
</html>
