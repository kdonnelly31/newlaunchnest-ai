<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In · Find My Shop</title>
<style>
  :root {
    --bg: #fdfaf6;
    --ink: #222;
    --muted: #6b6b6b;
    --accent: #d5641c;
    --card-bg: #ffffff;
    --border: #eee2d6;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .card {
    width: 100%;
    max-width: 380px;
    margin: 2rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2rem;
  }
  h1 {
    margin: 0 0 .25rem;
    font-size: 1.5rem;
  }
  p.subtitle {
    margin: 0 0 1.5rem;
    color: var(--muted);
  }
  label {
    display: block;
    font-size: .85rem;
    margin: 0 0 .3rem;
  }
  input {
    width: 100%;
    padding: .65rem .8rem;
    margin-bottom: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: .75rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: .6;
    cursor: not-allowed;
  }
  #message {
    min-height: 1.3rem;
    margin-top: 1rem;
    font-size: .9rem;
    text-align: center;
  }
  #message.error { color: var(--error); }
  #message.success { color: #1a7a35; }
</style>
</head>
<body>
  <div class="card">
    <h1>Welcome</h1>
    <p class="subtitle" id="subtitle">Log in to LaunchNestAI — no password needed. We'll email you a code to sign in.</p>

    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required />

      <button id="submit-btn" type="submit">Send Code</button>
    </form>

    <form id="code-form" style="display:none;">
      <label for="code">Verification code</label>
      <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="one-time-code" required />

      <button id="verify-btn" type="submit">Verify Code</button>
      <p><a id="use-different-email" href="#">Use a different email</a></p>
    </form>

    <p id="message"></p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const codeForm = document.getElementById('code-form');
    const verifyBtn = document.getElementById('verify-btn');
    const useDifferentEmail = document.getElementById('use-different-email');
    const subtitle = document.getElementById('subtitle');
    const message = document.getElementById('message');
    let pendingEmail = '';

    function showMessage(text, kind) {
      message.textContent = text;
      message.className = kind;
    }

    async function init() {
      const configRes = await fetch('/api/config');
      if (!configRes.ok) {
        showMessage('Login is not available right now — the site is missing its Supabase configuration.', 'error');
        submitBtn.disabled = true;
        return;
      }
      const { supabaseUrl, supabaseAnonKey } = await configRes.json();
      const supabase = createClient(supabaseUrl, supabaseAnonKey);

      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = '/';
        return;
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        showMessage('Sending your code…', '');

        const email = document.getElementById('email').value.trim();

        // signInWithOtp both signs in an existing user and creates a new one
        // on first use, so there's no separate signup step. No emailRedirectTo
        // here -- the buyer types the code back in rather than clicking a
        // link, which sidesteps corporate email scanners (e.g. Microsoft
        // Defender Safe Links) silently consuming a one-time link before the
        // person ever clicks it themselves.
        const { error } = await supabase.auth.signInWithOtp({ email });

        if (error) {
          showMessage(error.message, 'error');
          submitBtn.disabled = false;
          return;
        }

        pendingEmail = email;
        subtitle.textContent = `Enter the code we emailed to ${email}.`;
        loginForm.style.display = 'none';
        codeForm.style.display = 'block';
        showMessage('Check your email for the code. Not there? Check your spam/junk folder.', 'success');
        document.getElementById('code').focus();
      });

      codeForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        verifyBtn.disabled = true;
        showMessage('Verifying…', '');

        const token = document.getElementById('code').value.trim();

        const { error } = await supabase.auth.verifyOtp({ email: pendingEmail, token, type: 'email' });

        if (error) {
          showMessage(error.message, 'error');
          verifyBtn.disabled = false;
          return;
        }

        window.location.href = '/';
      });

      useDifferentEmail.addEventListener('click', (e) => {
        e.preventDefault();
        pendingEmail = '';
        codeForm.reset();
        codeForm.style.display = 'none';
        loginForm.style.display = '';
        loginForm.reset();
        submitBtn.disabled = false;
        subtitle.textContent = 'Log in to LaunchNestAI — no password needed. We\'ll email you a code to sign in.';
        showMessage('', '');
      });
    }

    init();
  </script>
</body>
</html>
