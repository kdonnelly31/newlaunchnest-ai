<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Etsy Shop Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #fdfaf6;
    --ink: #222;
    --muted: #6b6b6b;
    --accent: #d5641c;
    --card-bg: #ffffff;
    --border: #eee2d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 2rem 1.5rem 1rem;
    text-align: center;
  }
  header h1 {
    margin: 0 0 .25rem;
    font-size: 1.8rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
  }
  .search-bar {
    max-width: 480px;
    margin: 1.5rem auto;
    display: flex;
    gap: .5rem;
    padding: 0 1rem;
  }
  .search-bar input {
    flex: 1;
    padding: .7rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
  }
  .search-bar button {
    padding: .7rem 1.4rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  .search-bar button:disabled {
    opacity: .6;
    cursor: not-allowed;
  }
  .search-bar input[readonly] {
    background: var(--border);
    color: var(--muted);
    cursor: default;
  }
  .change-shop-link {
    display: none;
    align-self: center;
    font-size: .85rem;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    white-space: nowrap;
  }
  #status {
    text-align: center;
    color: var(--muted);
    min-height: 1.4rem;
    padding: 0 1rem;
  }
  #shop-info {
    text-align: center;
    margin-bottom: 1rem;
  }
  #shop-info img {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
  }
  #shop-info h2 { margin: .5rem 0 0; }
  #shop-info span { color: var(--muted); font-size: .9rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.25rem;
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 1.5rem 3rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
  }
  .card a { text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%; }
  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #f0ece6;
  }
  .card .body {
    padding: .8rem .9rem 1rem;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card .title {
    font-size: .92rem;
    line-height: 1.3;
    margin: 0 0 .5rem;
    flex: 1;
  }
  .card .price {
    font-weight: 600;
    color: var(--accent);
    font-size: 1.05rem;
  }
  .card .qty {
    font-size: .8rem;
    color: var(--muted);
    margin-top: .2rem;
  }
  .listing-picker {
    max-width: 700px;
    margin: 0 auto 1rem;
    padding: 0 1rem;
    display: none;
    gap: .8rem;
  }
  .listing-picker .picker-row {
    display: flex;
    gap: .8rem;
  }
  .listing-picker .picker-field {
    display: flex;
    flex-direction: column;
    gap: .3rem;
  }
  .listing-picker label {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
  }
  #listing-field { flex: 3; }
  #social-field { flex: 1; min-width: 150px; }
  .listing-picker select {
    width: 100%;
    padding: .6rem .8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .95rem;
    background: white;
  }
  #detail {
    max-width: 900px;
    margin: 0 auto 3rem;
    padding: 0 1.5rem;
    display: none;
  }
  #detail .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem 1.75rem;
  }
  #detail h2 {
    margin: 0 0 .25rem;
    font-size: 1.3rem;
  }
  #detail .detail-actions {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    margin: .3rem 0 0;
  }
  #detail .detail-url {
    font-size: .85rem;
  }
  .landing-btn {
    border: 1px solid var(--accent);
    color: var(--accent);
    background: transparent;
    border-radius: 999px;
    padding: .4rem 1rem;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .landing-btn:hover:not(:disabled) {
    background: var(--accent);
    color: white;
  }
  .landing-btn:disabled {
    opacity: .6;
    cursor: wait;
  }
  #detail .images {
    display: flex;
    gap: .6rem;
    overflow-x: auto;
    margin: 1rem 0;
    padding-bottom: .4rem;
  }
  #detail .images img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
    flex: 0 0 auto;
    background: #f0ece6;
  }
  #detail .description {
    white-space: pre-wrap;
    font-size: .9rem;
    line-height: 1.5;
    color: var(--ink);
    margin: 1rem 0;
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .8rem;
  }
  #detail section {
    margin-top: 1.4rem;
  }
  #detail section h3 {
    margin: 0 0 .6rem;
    font-size: 1rem;
    color: var(--accent);
    border-bottom: 1px solid var(--border);
    padding-bottom: .3rem;
  }
  .kv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: .5rem 1.2rem;
  }
  .kv-grid .kv {
    font-size: .85rem;
    line-height: 1.4;
  }
  .kv-grid .kv .k {
    display: block;
    color: var(--muted);
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  .tag-list {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
  }
  .tag-list span {
    background: #f5efe6;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: .2rem .7rem;
    font-size: .78rem;
  }
  #detail details {
    margin-top: 1.4rem;
  }
  #detail summary {
    cursor: pointer;
    color: var(--accent);
    font-size: .9rem;
  }
  #detail pre {
    background: #1e1e1e;
    color: #e6e6e6;
    padding: 1rem;
    border-radius: 8px;
    overflow-x: auto;
    font-size: .78rem;
    margin-top: .6rem;
  }
</style>
<style id="lp-styles">
  /* Landing page (generated) — copied into the new tab it opens in, via
     this element's textContent, so it must stay a self-contained block. */
  .lp-root {
    --lp-paper: #F8F5EF;
    --lp-ink: #1D1B17;
    --lp-ink-soft: #57534A;
    --lp-accent: #2E4636;
    --lp-accent-warm: #C79A53;
    --lp-line: #E4DECE;
    background: var(--lp-paper);
    color: var(--lp-ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .lp-root .lp-display { font-family: "Fraunces", Georgia, serif; }
  .lp-root .lp-mono { font-family: "JetBrains Mono", ui-monospace, monospace; }

  .lp-close {
    position: sticky;
    top: 0;
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    margin: 0;
    padding: .9rem 1.5rem;
    border: none;
    background: var(--lp-paper);
    color: var(--lp-ink-soft);
    font-family: "Inter", sans-serif;
    font-size: .85rem;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 1px solid var(--lp-line);
    width: 100%;
    text-align: left;
  }
  .lp-close:hover { color: var(--lp-ink); }
  .lp-close:focus-visible { outline: 2px solid var(--lp-accent); outline-offset: -2px; }

  .lp-hero {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 4.5rem;
    align-items: center;
    max-width: 1160px;
    margin: 0 auto;
    padding: 3.5rem 1.75rem 5rem;
  }
  .lp-hero-media { position: relative; }
  .lp-hero-media img {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 3px;
    background: #eee7d9;
  }
  .lp-price-tag {
    position: absolute;
    left: -1.1rem;
    bottom: -1.1rem;
    background: var(--lp-paper);
    border: 1px solid var(--lp-ink);
    box-shadow: 5px 5px 0 var(--lp-accent-warm);
    padding: .65rem 1.1rem .65rem 2rem;
    font-size: .95rem;
    font-weight: 500;
  }
  .lp-price-tag::before {
    content: "";
    position: absolute;
    left: .7rem;
    top: 50%;
    transform: translateY(-50%);
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1.5px solid var(--lp-ink);
    background: var(--lp-paper);
  }
  .lp-price-tag .lp-currency { color: var(--lp-ink-soft); font-size: .75rem; margin-left: .3rem; }

  .lp-eyebrow {
    display: inline-block;
    font-family: "JetBrains Mono", monospace;
    font-size: .72rem;
    letter-spacing: .09em;
    color: var(--lp-accent);
    border: 1px solid var(--lp-accent);
    border-radius: 999px;
    padding: .3rem .8rem;
    margin-bottom: 1.1rem;
  }
  .lp-headline {
    font-size: clamp(2.2rem, 4.2vw, 3.4rem);
    line-height: 1.05;
    font-weight: 500;
    letter-spacing: -.01em;
    margin: 0 0 1rem;
  }
  .lp-subheadline {
    font-size: 1.1rem;
    line-height: 1.5;
    color: var(--lp-ink-soft);
    margin: 0 0 1.8rem;
    max-width: 34ch;
  }
  .lp-cta {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    background: var(--lp-accent);
    color: var(--lp-paper);
    text-decoration: none;
    font-weight: 600;
    font-size: .95rem;
    padding: .85rem 1.6rem;
    border-radius: 3px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .lp-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(46,70,54,.28); }
  .lp-cta:focus-visible { outline: 2px solid var(--lp-ink); outline-offset: 3px; }
  .lp-stock {
    margin: 1.1rem 0 0;
    font-size: .82rem;
    color: var(--lp-ink-soft);
  }

  .lp-story {
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem 1.75rem 4rem;
  }
  .lp-pullquote {
    font-family: "Fraunces", Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.3rem, 2.4vw, 1.7rem);
    line-height: 1.4;
    color: var(--lp-ink);
    margin: 0 0 1.4rem;
  }
  .lp-story-body p {
    font-size: 1.02rem;
    line-height: 1.75;
    color: var(--lp-ink-soft);
    margin: 0 0 1.1rem;
  }

  .lp-highlights {
    max-width: 1160px;
    margin: 0 auto;
    padding: 1rem 1.75rem 4rem;
  }
  .lp-highlights ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 1.4rem 2rem;
    border-top: 1px solid var(--lp-line);
    padding-top: 1.8rem;
  }
  .lp-highlights li {
    font-size: .95rem;
    line-height: 1.4;
    padding-left: 1.6rem;
    position: relative;
  }
  .lp-highlights li::before {
    content: "";
    position: absolute;
    left: 0;
    top: .3rem;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--lp-accent-warm);
  }

  .lp-social {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1.75rem 4rem;
  }
  .lp-social-card {
    border: 1px solid var(--lp-line);
    border-radius: 6px;
    padding: 1.5rem 1.75rem;
    background: #FCFBF7;
  }
  .lp-social-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 1rem;
  }
  .lp-social-platform {
    font-family: "JetBrains Mono", monospace;
    font-size: .72rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--lp-accent);
  }
  .lp-copy-btn {
    border: 1px solid var(--lp-ink);
    background: transparent;
    color: var(--lp-ink);
    font-family: "Inter", sans-serif;
    font-size: .78rem;
    font-weight: 600;
    padding: .35rem .8rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .lp-copy-btn:hover { background: var(--lp-ink); color: var(--lp-paper); }
  .lp-social-title {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: 1.15rem;
    margin: 0 0 .6rem;
  }
  .lp-social-caption {
    font-size: .95rem;
    line-height: 1.6;
    color: var(--lp-ink-soft);
    white-space: pre-wrap;
    margin: 0;
  }
  .lp-social-tags {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    margin-top: 1rem;
  }
  .lp-social-tags span {
    font-size: .8rem;
    color: var(--lp-accent);
  }
  .lp-pin-post {
    display: flex;
    gap: .7rem;
    margin-top: 1.4rem;
    padding-top: 1.2rem;
    border-top: 1px solid var(--lp-line);
  }
  .lp-pin-post select,
  .lp-pin-post input[type="file"] {
    flex: 1;
    padding: .5rem .7rem;
    border: 1px solid var(--lp-line);
    border-radius: 4px;
    font-family: "Inter", sans-serif;
    font-size: .85rem;
    background: white;
  }
  .lp-pin-btn {
    padding: .5rem 1.2rem;
    font-size: .85rem;
  }
  .lp-pin-btn:disabled, .lp-pin-post select:disabled {
    opacity: .5;
    cursor: not-allowed;
  }
  .lp-pin-status {
    font-size: .82rem;
    color: var(--lp-ink-soft);
    margin: .7rem 0 0;
  }
  .lp-pin-status a { color: var(--lp-accent); }

  .lp-stats {
    background: var(--lp-ink);
    color: var(--lp-paper);
    padding: 3rem 1.75rem;
  }
  .lp-stats-inner {
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 2rem;
    text-align: center;
  }
  .lp-stats strong {
    display: block;
    font-family: "Fraunces", Georgia, serif;
    font-size: 2.1rem;
    font-weight: 500;
  }
  .lp-stats span {
    display: block;
    font-size: .8rem;
    color: #C9C4B6;
    margin-top: .3rem;
    text-transform: uppercase;
    letter-spacing: .04em;
  }

  .lp-gallery {
    max-width: 1160px;
    margin: 0 auto;
    padding: 3.5rem 1.75rem;
    display: flex;
    gap: 1rem;
    overflow-x: auto;
  }
  .lp-gallery img {
    width: 220px;
    height: 220px;
    object-fit: cover;
    border-radius: 3px;
    flex: 0 0 auto;
    background: #eee7d9;
  }

  .lp-final-cta {
    text-align: center;
    padding: 4.5rem 1.75rem 5rem;
  }
  .lp-final-cta h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: clamp(1.6rem, 3vw, 2.2rem);
    margin: 0 0 1.6rem;
  }

  .lp-footer {
    border-top: 1px solid var(--lp-line);
    text-align: center;
    padding: 1.6rem;
    font-size: .82rem;
    color: var(--lp-ink-soft);
  }
  .lp-footer a { color: var(--lp-ink); }

  @media (prefers-reduced-motion: no-preference) {
    .lp-hero-content > * { animation: lp-rise .6s ease both; }
    .lp-hero-content > *:nth-child(2) { animation-delay: .06s; }
    .lp-hero-content > *:nth-child(3) { animation-delay: .12s; }
    .lp-hero-content > *:nth-child(4) { animation-delay: .18s; }
    .lp-hero-content > *:nth-child(5) { animation-delay: .24s; }
    @keyframes lp-rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }

  @media (max-width: 760px) {
    .lp-hero { grid-template-columns: 1fr; gap: 2.5rem; padding-top: 2rem; }
    .lp-price-tag { position: static; display: inline-block; margin-top: 1rem; box-shadow: none; border: 1px solid var(--lp-ink); }
  }
</style>
</head>
<body>
  <span id="pages-remaining" style="display:none; position:fixed; top:1rem; right:11.5rem; font-size:.85rem; color:var(--muted);"></span>
  <a id="admin-link" href="/admin.html" style="display:none; position:fixed; top:1rem; right:5rem; font-size:.85rem; color:var(--muted); text-decoration:none;">Admin</a>
  <a id="logout-link" href="#" style="display:none; position:fixed; top:1rem; right:1.25rem; font-size:.85rem; color:var(--muted); text-decoration:none;">Log out</a>

  <header>
    <h1>Etsy Shop Viewer</h1>
    <p>Enter a public Etsy shop name to see everything they have listed.</p>
  </header>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const configRes = await fetch('/api/config');
    if (configRes.ok) {
      const { supabaseUrl, supabaseAnonKey } = await configRes.json();
      // Reads from either storage since "Remember me" on the login page may have
      // put the session in sessionStorage instead of the default localStorage.
      const supabase = createClient(supabaseUrl, supabaseAnonKey, {
        auth: {
          storage: {
            getItem: (key) => localStorage.getItem(key) ?? sessionStorage.getItem(key),
            setItem: (key, value) => localStorage.setItem(key, value),
            removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); },
          },
        },
      });

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '/login.html';
      } else {
        // Exposed so the plain <script> below (app functionality) can attach
        // the session token to its API calls — the server now requires it.
        window.authedFetch = (url, options = {}) => fetch(url, {
          ...options,
          headers: { ...(options.headers || {}), Authorization: `Bearer ${session.access_token}` },
        });

        const logoutLink = document.getElementById('logout-link');
        logoutLink.style.display = 'block';
        logoutLink.addEventListener('click', async (e) => {
          e.preventDefault();
          await supabase.auth.signOut();
          window.location.href = '/login.html';
        });

        const { data: profile } = await supabase
          .from('profiles')
          .select('role, status')
          .eq('id', session.user.id)
          .single();
        if (profile?.role === 'admin') {
          document.getElementById('admin-link').style.display = 'block';
        }

        if (profile?.role !== 'admin' && profile?.status !== 'approved') {
          document.body.innerHTML = `
            <div style="max-width:420px; margin:4rem auto; text-align:center; padding:0 1.5rem;
                        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
              <h1 style="margin-bottom:.5rem;">Almost there</h1>
              <p style="color:#6b6b6b;">Your account is awaiting approval. You'll be able to use the app once an admin approves it.</p>
              <p><a id="pending-logout" href="#" style="color:#d5641c;">Log out</a></p>
            </div>`;
          document.getElementById('pending-logout').addEventListener('click', async (e) => {
            e.preventDefault();
            await supabase.auth.signOut();
            window.location.href = '/login.html';
          });
        } else {
          // Exposed so the plain <script> below can check/consume the page
          // allowance (create_landing_page_allowed RPC, landing_pages insert).
          window.supabaseClient = supabase;
          window.currentUserId = session.user.id;

          window.refreshPagesRemaining = async () => {
            const { data, error } = await supabase.rpc('create_landing_page_allowed', {
              p_user_id: session.user.id,
            });
            const pagesRemainingEl = document.getElementById('pages-remaining');
            if (error || !data?.[0]) return;
            const { remaining } = data[0];
            pagesRemainingEl.textContent = remaining === null ? 'Unlimited pages' : `${remaining} page(s) left`;
            pagesRemainingEl.style.display = 'block';
          };
          window.refreshPagesRemaining();
        }
      }
    }
  </script>

  <div class="search-bar">
    <input id="shop-input" type="text" placeholder="e.g. YarnCraftCo" />
    <button id="search-btn">Search</button>
    <span class="change-shop-link" id="change-shop-link">Change shop</span>
  </div>

  <p id="status"></p>
  <div id="shop-info"></div>

  <div class="listing-picker" id="listing-picker">
    <div class="picker-row">
      <div class="picker-field" id="listing-field">
        <label for="listing-select">Product</label>
        <select id="listing-select">
          <option value="">Select a listing to see full details…</option>
        </select>
      </div>
      <div class="picker-field" id="social-field">
        <label for="social-select">Social Media</label>
        <select id="social-select">
          <option value="tiktok">TikTok</option>
          <option value="facebook">Facebook</option>
          <option value="instagram">Instagram</option>
          <option value="pinterest">Pinterest</option>
          <option value="all">All</option>
        </select>
      </div>
    </div>
  </div>

  <div id="detail"></div>

  <div class="grid" id="grid"></div>

  <script>
    const input = document.getElementById('shop-input');
    const btn = document.getElementById('search-btn');
    const changeShopLink = document.getElementById('change-shop-link');
    const status = document.getElementById('status');
    const shopInfo = document.getElementById('shop-info');
    const grid = document.getElementById('grid');
    const listingPicker = document.getElementById('listing-picker');
    const listingSelect = document.getElementById('listing-select');
    const socialSelect = document.getElementById('social-select');
    const detail = document.getElementById('detail');
    let currentListing = null;

    async function search() {
      const shopName = input.value.trim();
      if (!shopName) return;

      btn.disabled = true;
      status.textContent = `Loading listings for "${shopName}"…`;
      shopInfo.innerHTML = '';
      grid.innerHTML = '';
      detail.style.display = 'none';
      detail.innerHTML = '';
      listingPicker.style.display = 'none';
      listingSelect.innerHTML = '<option value="">Select a listing to see full details…</option>';

      try {
        const res = await authedFetch(`/api/shop/${encodeURIComponent(shopName)}`);
        const data = await res.json();

        if (!res.ok) {
          status.textContent = data.error || 'Something went wrong.';
          return;
        }

        status.textContent = `${data.listings.length} active listing(s) found.`;

        // Lock the field to the shop's official name (Etsy's casing may differ
        // from what was typed) so it can't be edited mid-session by accident.
        input.value = data.shop.name;
        input.readOnly = true;
        changeShopLink.style.display = 'inline';

        shopInfo.innerHTML = `
          ${data.shop.icon ? `<img src="${data.shop.icon}" alt="${data.shop.name}" />` : ''}
          <h2>${data.shop.title || data.shop.name}</h2>
          <span>@${data.shop.name}</span>
        `;

        grid.innerHTML = data.listings.map(listing => `
          <div class="card">
            <a href="${listing.url}" target="_blank" rel="noopener noreferrer">
              <img src="${listing.image || ''}" alt="${escapeHtml(listing.title)}" loading="lazy" />
              <div class="body">
                <p class="title">${escapeHtml(listing.title)}</p>
                <div class="price">${listing.price ? `$${listing.price} ${listing.currency}` : ''}</div>
                <div class="qty">${listing.quantity} in stock</div>
              </div>
            </a>
          </div>
        `).join('');

        if (data.listings.length) {
          listingPicker.style.display = 'block';
          for (const listing of data.listings) {
            const opt = document.createElement('option');
            opt.value = listing.id;
            opt.textContent = listing.title;
            listingSelect.appendChild(opt);
          }
        }
      } catch (err) {
        status.textContent = 'Failed to reach the server: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function showListingDetail(listingId) {
      if (!listingId) {
        detail.style.display = 'none';
        detail.innerHTML = '';
        return;
      }

      detail.style.display = 'block';
      detail.innerHTML = '<div class="panel">Loading listing details…</div>';

      try {
        const res = await authedFetch(`/api/listing/${listingId}`);
        const listing = await res.json();

        if (!res.ok) {
          detail.innerHTML = `<div class="panel">${escapeHtml(listing.error || 'Failed to load listing.')}</div>`;
          return;
        }

        currentListing = listing;
        detail.innerHTML = renderListingDetail(listing);
        document.getElementById('create-landing-btn').addEventListener('click', createLandingPage);
      } catch (err) {
        detail.innerHTML = `<div class="panel">Failed to reach the server: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderListingDetail(l) {
      const price = l.price ? (Number(l.price.amount) / Number(l.price.divisor)).toFixed(2) : null;
      const images = (l.images || []).map(img => `
        <img src="${img.url_570xN || img.url_fullxfull || ''}" alt="" loading="lazy" />
      `).join('');

      const overview = kvGrid([
        ['Price', price ? `$${price} ${l.price.currency_code}` : '—'],
        ['Quantity available', l.quantity],
        ['Views', l.views],
        ['Favorers', l.num_favorers],
        ['State', l.state],
        ['Listing type', l.listing_type],
        ['Who made it', l.who_made],
        ['When made', l.when_made],
        ['Is supply', l.is_supply],
        ['Customizable', l.is_customizable],
        ['Personalizable', l.is_personalizable],
        ['Taxable', l.is_taxable],
        ['Taxonomy ID', l.taxonomy_id],
        ['Created', formatDate(l.original_creation_timestamp)],
        ['Last modified', formatDate(l.last_modified_timestamp)],
        ['Listing expires', formatDate(l.ending_timestamp)],
      ]);

      const shipping = kvGrid([
        ['Processing time', l.processing_min != null ? `${l.processing_min}–${l.processing_max} business days` : '—'],
        ['Shipping profile ID', l.shipping_profile_id ?? '—'],
        ['Return policy ID', l.return_policy_id ?? '—'],
        ['Item weight', l.item_weight ? `${l.item_weight} ${l.item_weight_unit || ''}` : '—'],
        ['Dimensions', (l.item_length || l.item_width || l.item_height)
          ? `${l.item_length ?? '?'} x ${l.item_width ?? '?'} x ${l.item_height ?? '?'} ${l.item_dimensions_unit || ''}`
          : '—'],
      ]);

      const shopSection = l.shop ? kvGrid([
        ['Shop name', escapeHtml(l.shop.shop_name)],
        ['Shop title', escapeHtml(l.shop.title)],
        ['Shop URL', l.shop.url ? `<a href="${l.shop.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(l.shop.url)}</a>` : '—'],
        ['On vacation', l.shop.is_vacation],
        ['Review average', l.shop.review_average ?? '—'],
        ['Review count', l.shop.review_count ?? '—'],
        ['Active listings', l.shop.listing_active_count ?? '—'],
        ['Sales', l.shop.transaction_sold_count ?? '—'],
        ['Shop location', escapeHtml(l.shop.shop_location_country_iso) || '—'],
        ['Currency', escapeHtml(l.shop.currency_code) || '—'],
      ]) : '<p>Not available.</p>';

      const userSection = l.user ? kvGrid([
        ['User ID', l.user.user_id],
        ['Login name', escapeHtml(l.user.login_name) || '—'],
      ]) : '<p>Not available.</p>';

      const tagList = (l.tags || []).map(t => `<span>${escapeHtml(t)}</span>`).join('') || '<p>None</p>';
      const materialList = (l.materials || []).map(t => `<span>${escapeHtml(t)}</span>`).join('') || '<p>None</p>';

      const videosSection = (l.videos && l.videos.length)
        ? l.videos.map(v => `<p><a href="${v.video_url}" target="_blank" rel="noopener noreferrer">Video ${v.video_id}</a></p>`).join('')
        : '<p>None</p>';

      return `
        <div class="panel">
          <h2>${escapeHtml(l.title)}</h2>
          <div class="detail-actions">
            <a class="detail-url" href="${l.url}" target="_blank" rel="noopener noreferrer">View on Etsy →</a>
            <button id="create-landing-btn" class="landing-btn">✦ Create Landing Page</button>
          </div>

          ${images ? `<div class="images">${images}</div>` : ''}

          <div class="description">${escapeHtml(l.description || 'No description.')}</div>

          <section>
            <h3>Overview</h3>
            ${overview}
          </section>

          <section>
            <h3>Shipping &amp; Policies</h3>
            ${shipping}
          </section>

          <section>
            <h3>Tags</h3>
            <div class="tag-list">${tagList}</div>
          </section>

          <section>
            <h3>Materials</h3>
            <div class="tag-list">${materialList}</div>
          </section>

          <section>
            <h3>Shop</h3>
            ${shopSection}
          </section>

          <section>
            <h3>Seller (User)</h3>
            ${userSection}
          </section>

          <section>
            <h3>Videos</h3>
            ${videosSection}
          </section>

          <details>
            <summary>Show raw Etsy API data</summary>
            <pre>${escapeHtml(JSON.stringify(l, null, 2))}</pre>
          </details>
        </div>
      `;
    }

    async function createLandingPage() {
      if (!currentListing) return;
      const btn = document.getElementById('create-landing-btn');
      const originalLabel = btn.textContent;

      const { data: allowance, error: allowanceError } = await window.supabaseClient.rpc(
        'create_landing_page_allowed',
        { p_user_id: window.currentUserId },
      );
      if (allowanceError) {
        status.textContent = 'Could not check your page allowance: ' + allowanceError.message;
        return;
      }
      if (!allowance?.[0]?.allowed) {
        status.textContent = "You've reached your page limit — purchase again to unlock 3 more pages.";
        return;
      }

      // Open the tab synchronously, in direct response to the click — opening
      // it after the awaited fetch below would get blocked as a popup.
      const newTab = window.open('', '_blank');
      if (!newTab) {
        alert('Please allow pop-ups for this site to open the landing page in a new tab.');
        return;
      }
      newTab.document.write('<!DOCTYPE html><title>Loading…</title><body style="font-family:sans-serif;padding:2rem;color:#57534A;">Writing your landing page…</body>');
      newTab.document.close();

      btn.disabled = true;
      btn.textContent = 'Writing your landing page…';

      const l = currentListing;
      const platforms = socialSelect.value === 'all' ? ALL_PLATFORMS : [socialSelect.value];
      const price = l.price ? (Number(l.price.amount) / Number(l.price.divisor)).toFixed(2) : null;

      try {
        const res = await authedFetch('/api/landing-copy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: l.title,
            description: l.description,
            price,
            currency: l.price?.currency_code,
            tags: l.tags,
            materials: l.materials,
            shopName: l.shop?.shop_name,
            platforms,
          }),
        });
        const copy = await res.json();

        if (!res.ok) {
          newTab.document.body.textContent = copy.error || 'Failed to generate landing page copy.';
          return;
        }

        newTab.document.open();
        newTab.document.write(buildLandingPageDocument(l, copy, price));
        newTab.document.close();

        // RLS re-checks the allowance on this insert independently of the
        // RPC check above, so a page can't be recorded past the limit even
        // if something raced between the two.
        const { error: insertError } = await window.supabaseClient
          .from('landing_pages')
          .insert({ user_id: window.currentUserId });
        if (insertError) console.error('Failed to record landing page:', insertError.message);
        window.refreshPagesRemaining();
      } catch (err) {
        newTab.document.body.textContent = 'Failed to reach the server: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    }

    // Builds a fully self-contained HTML document (styles + interactivity
    // inlined) for the new tab createLandingPage() opens — the new tab has
    // no access to this page's script scope once it navigates its own
    // document, so the posting handlers are serialized in via .toString().
    function buildLandingPageDocument(l, copy, price) {
      const styles = document.getElementById('lp-styles').textContent;
      const bodyHtml = renderLandingPage(l, copy, price);
      // Neutralize "<" so nothing in listing/copy data (both external,
      // untrusted text) can break out of the inline <script> block below.
      const safeListing = JSON.stringify(l).replace(/</g, '\\u003c');
      const safePosts = JSON.stringify(copy.socialPosts || []).replace(/</g, '\\u003c');

      return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>${escapeHtml(copy.headline)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>${styles}</style>
</head>
<body>
${bodyHtml}
<script>
${escapeHtml.toString()}
${initPinterestPosting.toString()}
${initFacebookPosting.toString()}
${initInstagramPosting.toString()}
${initTikTokPosting.toString()}

document.getElementById('lp-close-btn')?.addEventListener('click', () => window.close());
document.body.addEventListener('click', async e => {
  const copyBtn = e.target.closest('.lp-copy-btn');
  if (!copyBtn) return;
  try {
    await navigator.clipboard.writeText(copyBtn.dataset.copy);
    const original = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(() => { copyBtn.textContent = original; }, 1500);
  } catch (err) {
    alert('Could not copy — your browser blocked clipboard access.');
  }
});

const listing = ${safeListing};
const socialPosts = ${safePosts};
const platformInit = { pinterest: initPinterestPosting, facebook: initFacebookPosting, instagram: initInstagramPosting, tiktok: initTikTokPosting };
for (const post of socialPosts) { platformInit[post.platform]?.(listing, post); }
<\/script>
</body>
</html>`;
    }

    function renderLandingPage(l, copy, price) {
      const heroImage = l.images?.[0]?.url_fullxfull || l.images?.[0]?.url_570xN || '';
      const galleryImages = (l.images || []).slice(1);
      const shop = l.shop;

      const stats = [];
      if (shop?.review_average) stats.push([shop.review_average, 'Average rating']);
      if (shop?.review_count) stats.push([shop.review_count.toLocaleString(), 'Shop reviews']);
      if (l.num_favorers) stats.push([l.num_favorers.toLocaleString(), 'Favorited by shoppers']);
      if (shop?.transaction_sold_count) stats.push([shop.transaction_sold_count.toLocaleString(), 'Etsy sales']);

      return `
        <div class="lp-root">
          <button id="lp-close-btn" class="lp-close">✕ Close tab</button>

          <section class="lp-hero">
            <div class="lp-hero-media">
              ${heroImage ? `<img src="${heroImage}" alt="${escapeHtml(l.title)}" />` : ''}
              ${price ? `<div class="lp-price-tag lp-mono">$${price}<span class="lp-currency">${escapeHtml(l.price.currency_code)}</span></div>` : ''}
            </div>
            <div class="lp-hero-content">
              <span class="lp-eyebrow">${escapeHtml(copy.eyebrow)}</span>
              <h1 class="lp-headline lp-display">${escapeHtml(copy.headline)}</h1>
              <p class="lp-subheadline">${escapeHtml(copy.subheadline)}</p>
              <a class="lp-cta" href="${l.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(copy.cta)} →</a>
              <p class="lp-stock">${l.quantity} in stock${shop ? ` · Handmade by ${escapeHtml(shop.shop_name)}` : ''}</p>
            </div>
          </section>

          <section class="lp-story">
            <p class="lp-pullquote">${escapeHtml(copy.story[0])}</p>
            <div class="lp-story-body">
              ${copy.story.slice(1).map(p => `<p>${escapeHtml(p)}</p>`).join('')}
            </div>
          </section>

          <section class="lp-highlights">
            <ul>
              ${copy.highlights.map(h => `<li>${escapeHtml(h)}</li>`).join('')}
            </ul>
          </section>

          ${(copy.socialPosts || []).map(post => renderSocialPost(post)).join('')}

          ${stats.length ? `
            <section class="lp-stats">
              <div class="lp-stats-inner">
                ${stats.map(([value, label]) => `
                  <div><strong>${value}</strong><span>${escapeHtml(label)}</span></div>
                `).join('')}
              </div>
            </section>
          ` : ''}

          ${galleryImages.length ? `
            <div class="lp-gallery">
              ${galleryImages.map(img => `<img src="${img.url_570xN || img.url_fullxfull}" alt="" loading="lazy" />`).join('')}
            </div>
          ` : ''}

          <section class="lp-final-cta">
            <h2 class="lp-display">Ready to make it yours?</h2>
            <a class="lp-cta" href="${l.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(copy.cta)} →</a>
          </section>

          <footer class="lp-footer">
            Handcrafted by <a href="${shop?.url || l.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(shop?.shop_name || 'the seller')}</a> on Etsy
          </footer>
        </div>
      `;
    }

    const ALL_PLATFORMS = ['tiktok', 'facebook', 'instagram', 'pinterest'];

    const PLATFORM_LABELS = {
      tiktok: 'TikTok',
      facebook: 'Facebook',
      instagram: 'Instagram',
      pinterest: 'Pinterest',
    };

    function renderSocialPost(post) {
      const label = PLATFORM_LABELS[post.platform] || post.platform;
      const postText = [post.title, post.caption, post.hashtags?.map(h => `#${h}`).join(' ')]
        .filter(Boolean).join('\n\n');

      return `
        <section class="lp-social">
          <div class="lp-social-card">
            <div class="lp-social-head">
              <span class="lp-social-platform">${escapeHtml(label)} post draft</span>
              <button type="button" class="lp-copy-btn" data-copy="${escapeHtml(postText)}">Copy text</button>
            </div>
            ${post.title ? `<p class="lp-social-title">${escapeHtml(post.title)}</p>` : ''}
            <p class="lp-social-caption">${escapeHtml(post.caption)}</p>
            ${post.hashtags?.length ? `
              <div class="lp-social-tags">
                ${post.hashtags.map(h => `<span>#${escapeHtml(h)}</span>`).join('')}
              </div>
            ` : ''}
            ${post.platform === 'pinterest' ? `
              <div class="lp-pin-post" id="lp-pin-post">
                <select id="lp-pin-board" disabled><option>Loading your boards…</option></select>
                <button type="button" id="lp-pin-btn" class="lp-cta lp-pin-btn" disabled>Post to Pinterest</button>
              </div>
              <p class="lp-pin-status" id="lp-pin-status"></p>
            ` : ''}
            ${post.platform === 'facebook' ? `
              <div class="lp-pin-post" id="lp-fb-post">
                <button type="button" id="lp-fb-btn" class="lp-cta lp-pin-btn">Post to Facebook Page</button>
              </div>
              <p class="lp-pin-status" id="lp-fb-status"></p>
            ` : ''}
            ${post.platform === 'instagram' ? `
              <div class="lp-pin-post" id="lp-ig-post">
                <button type="button" id="lp-ig-btn" class="lp-cta lp-pin-btn">Post to Instagram</button>
              </div>
              <p class="lp-pin-status" id="lp-ig-status"></p>
            ` : ''}
            ${post.platform === 'tiktok' ? `
              <div class="lp-pin-post" id="lp-tiktok-post">
                <input type="file" id="lp-tiktok-file" accept="video/mp4,video/quicktime,video/webm" />
                <button type="button" id="lp-tiktok-btn" class="lp-cta lp-pin-btn" disabled>Post to TikTok</button>
              </div>
              <p class="lp-pin-status" id="lp-tiktok-status">Checking connection…</p>
            ` : ''}
          </div>
        </section>
      `;
    }

    async function initPinterestPosting(l, socialPost) {
      const boardSelect = document.getElementById('lp-pin-board');
      const postBtn = document.getElementById('lp-pin-btn');
      const status = document.getElementById('lp-pin-status');
      const heroImage = l.images?.[0]?.url_fullxfull || l.images?.[0]?.url_570xN || '';

      try {
        const res = await authedFetch('/api/pinterest/boards');
        const data = await res.json();

        if (!res.ok) {
          boardSelect.innerHTML = '<option>Pinterest unavailable</option>';
          status.textContent = data.error || 'Could not load Pinterest boards.';
          return;
        }
        if (!data.boards?.length) {
          boardSelect.innerHTML = '<option>No boards found</option>';
          status.textContent = 'Create a board on Pinterest first.';
          return;
        }

        boardSelect.innerHTML = data.boards.map(b => `<option value="${b.id}">${escapeHtml(b.name)}</option>`).join('');
        boardSelect.disabled = false;
        postBtn.disabled = false;
      } catch (err) {
        boardSelect.innerHTML = '<option>Pinterest unavailable</option>';
        status.textContent = 'Failed to reach the server: ' + err.message;
        return;
      }

      postBtn.addEventListener('click', async () => {
        postBtn.disabled = true;
        const originalLabel = postBtn.textContent;
        postBtn.textContent = 'Posting…';
        status.textContent = '';

        try {
          const res = await authedFetch('/api/pinterest/pin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              boardId: boardSelect.value,
              imageUrl: heroImage,
              link: l.url,
              title: socialPost.title || l.title,
              description: socialPost.caption,
            }),
          });
          const result = await res.json();

          if (!res.ok) {
            status.textContent = result.error || 'Failed to post to Pinterest.';
            return;
          }

          status.innerHTML = `Posted! <a href="${result.url}" target="_blank" rel="noopener noreferrer">View pin →</a>`;
        } catch (err) {
          status.textContent = 'Failed to reach the server: ' + err.message;
        } finally {
          postBtn.disabled = false;
          postBtn.textContent = originalLabel;
        }
      });
    }

    function initFacebookPosting(l, socialPost) {
      const postBtn = document.getElementById('lp-fb-btn');
      const status = document.getElementById('lp-fb-status');
      const message = [socialPost.caption, socialPost.hashtags?.map(h => `#${h}`).join(' ')].filter(Boolean).join('\n\n');

      postBtn.addEventListener('click', async () => {
        postBtn.disabled = true;
        const originalLabel = postBtn.textContent;
        postBtn.textContent = 'Posting…';
        status.textContent = '';

        try {
          const res = await authedFetch('/api/facebook/post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message, link: l.url }),
          });
          const result = await res.json();

          if (!res.ok) {
            status.textContent = result.error || 'Failed to post to Facebook.';
            return;
          }
          status.innerHTML = `Posted! <a href="${result.url}" target="_blank" rel="noopener noreferrer">View post →</a>`;
        } catch (err) {
          status.textContent = 'Failed to reach the server: ' + err.message;
        } finally {
          postBtn.disabled = false;
          postBtn.textContent = originalLabel;
        }
      });
    }

    function initInstagramPosting(l, socialPost) {
      const postBtn = document.getElementById('lp-ig-btn');
      const status = document.getElementById('lp-ig-status');
      const heroImage = l.images?.[0]?.url_fullxfull || l.images?.[0]?.url_570xN || '';
      const caption = [socialPost.caption, socialPost.hashtags?.map(h => `#${h}`).join(' ')].filter(Boolean).join('\n\n');

      postBtn.addEventListener('click', async () => {
        postBtn.disabled = true;
        const originalLabel = postBtn.textContent;
        postBtn.textContent = 'Posting…';
        status.textContent = '';

        try {
          const res = await authedFetch('/api/instagram/post', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ imageUrl: heroImage, caption }),
          });
          const result = await res.json();

          if (!res.ok) {
            status.textContent = result.error || 'Failed to post to Instagram.';
            return;
          }
          status.innerHTML = `Posted! <a href="${result.url}" target="_blank" rel="noopener noreferrer">View post →</a>`;
        } catch (err) {
          status.textContent = 'Failed to reach the server: ' + err.message;
        } finally {
          postBtn.disabled = false;
          postBtn.textContent = originalLabel;
        }
      });
    }

    async function initTikTokPosting(l, socialPost) {
      const fileInput = document.getElementById('lp-tiktok-file');
      const postBtn = document.getElementById('lp-tiktok-btn');
      const status = document.getElementById('lp-tiktok-status');

      try {
        const res = await authedFetch('/api/tiktok/status');
        const data = await res.json();
        if (!data.connected) {
          status.innerHTML = `Not connected. <a href="/auth/tiktok" target="_blank" rel="noopener noreferrer">Connect TikTok →</a>`;
          return;
        }
        status.textContent = 'Connected. Choose a video to post (posts as private — visible only to your account — since this app is unaudited).';
      } catch (err) {
        status.textContent = 'Failed to reach the server: ' + err.message;
        return;
      }

      fileInput.addEventListener('change', () => {
        postBtn.disabled = !fileInput.files.length;
      });

      postBtn.addEventListener('click', async () => {
        if (!fileInput.files.length) return;
        postBtn.disabled = true;
        const originalLabel = postBtn.textContent;
        postBtn.textContent = 'Uploading…';

        const form = new FormData();
        form.append('video', fileInput.files[0]);
        form.append('title', [socialPost.caption, socialPost.hashtags?.map(h => `#${h}`).join(' ')].filter(Boolean).join(' '));

        try {
          const res = await authedFetch('/api/tiktok/post', { method: 'POST', body: form });
          const result = await res.json();

          if (!res.ok) {
            status.textContent = result.error || 'Failed to post to TikTok.';
            return;
          }
          status.textContent = result.note;
        } catch (err) {
          status.textContent = 'Failed to reach the server: ' + err.message;
        } finally {
          postBtn.disabled = false;
          postBtn.textContent = originalLabel;
        }
      });
    }

    function kvGrid(pairs) {
      return `<div class="kv-grid">${pairs.map(([k, v]) => `
        <div class="kv"><span class="k">${escapeHtml(k)}</span>${v ?? '—'}</div>
      `).join('')}</div>`;
    }

    function formatDate(unixSeconds) {
      if (!unixSeconds) return '—';
      return new Date(unixSeconds * 1000).toLocaleDateString(undefined, {
        year: 'numeric', month: 'short', day: 'numeric',
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function resetShopSearch() {
      input.value = '';
      input.readOnly = false;
      changeShopLink.style.display = 'none';
      status.textContent = '';
      shopInfo.innerHTML = '';
      grid.innerHTML = '';
      detail.style.display = 'none';
      detail.innerHTML = '';
      listingPicker.style.display = 'none';
      input.focus();
    }

    btn.addEventListener('click', search);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    changeShopLink.addEventListener('click', resetShopSearch);
    listingSelect.addEventListener('change', e => showListingDetail(e.target.value));
  </script>
</body>
