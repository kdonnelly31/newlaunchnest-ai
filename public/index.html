<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Find My Shop</title>
<style>
  :root {
    --bg: #fdfaf6;
    --ink: #222;
    --muted: #6b6b6b;
    --accent: #d5641c;
    --card-bg: #ffffff;
    --border: #eee2d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 2rem 1.5rem 1rem;
    text-align: center;
  }
  header h1 {
    margin: 0 0 .25rem;
    font-size: 1.8rem;
  }
  header p {
    margin: 0;
    color: var(--muted);
  }
  .search-bar {
    max-width: 480px;
    margin: 1.5rem auto;
    display: flex;
    gap: .5rem;
    padding: 0 1rem;
  }
  .search-bar input {
    flex: 1;
    padding: .7rem 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
  }
  .search-bar button {
    padding: .7rem 1.4rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  .search-bar button:disabled {
    opacity: .6;
    cursor: not-allowed;
  }
  .search-bar input[readonly] {
    background: var(--border);
    color: var(--muted);
    cursor: default;
  }
  .change-shop-link {
    display: none;
    align-self: center;
    font-size: .85rem;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    white-space: nowrap;
  }
  #status {
    text-align: center;
    color: var(--muted);
    min-height: 1.4rem;
    padding: 0 1rem;
  }
  #shop-info {
    text-align: center;
    margin-bottom: 1rem;
  }
  #shop-info img {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
  }
  #shop-info h2 { margin: .5rem 0 0; }
  #shop-info span { color: var(--muted); font-size: .9rem; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.25rem;
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 1.5rem 3rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
  }
  .card button {
    text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%;
    background: none; border: none; padding: 0; margin: 0; font: inherit; text-align: left; width: 100%; cursor: pointer;
  }
  .card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #f0ece6;
  }
  .card .body {
    padding: .8rem .9rem 1rem;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .card .title {
    font-size: .92rem;
    line-height: 1.3;
    margin: 0 0 .5rem;
    flex: 1;
  }
  .card .price {
    font-weight: 600;
    color: var(--accent);
    font-size: 1.05rem;
  }
  .card .qty {
    font-size: .8rem;
    color: var(--muted);
    margin-top: .2rem;
  }
  .listing-picker {
    max-width: 700px;
    margin: 0 auto 1rem;
    padding: 0 1rem;
    display: none;
    gap: .8rem;
  }
  .listing-picker .picker-row {
    display: flex;
    gap: .8rem;
  }
  .listing-picker .picker-field {
    display: flex;
    flex-direction: column;
    gap: .3rem;
  }
  .listing-picker label {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
  }
  #listing-field { flex: 3; }
  .listing-picker select {
    width: 100%;
    padding: .6rem .8rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .95rem;
    background: white;
  }
  #detail {
    max-width: 900px;
    margin: 0 auto 3rem;
    padding: 0 1.5rem;
    display: none;
  }
  #detail .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem 1.75rem;
  }
  #detail h2 {
    margin: 0 0 .25rem;
    font-size: 1.3rem;
  }
  #detail .detail-actions {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    margin: .3rem 0 0;
  }
  #detail .detail-url {
    font-size: .85rem;
  }
  .landing-btn {
    border: 1px solid var(--accent);
    color: var(--accent);
    background: transparent;
    border-radius: 999px;
    padding: .4rem 1rem;
    font-size: .82rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .landing-btn:hover:not(:disabled) {
    background: var(--accent);
    color: white;
  }
  .landing-btn:disabled {
    opacity: .6;
    cursor: wait;
  }
  #detail .images {
    display: flex;
    gap: .6rem;
    overflow-x: auto;
    margin: 1rem 0;
    padding-bottom: .4rem;
  }
  #detail .images img {
    width: 110px;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
    flex: 0 0 auto;
    background: #f0ece6;
  }
  #detail .description {
    white-space: pre-wrap;
    font-size: .9rem;
    line-height: 1.5;
    color: var(--ink);
    margin: 1rem 0;
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .8rem;
  }
</style>
</head>
<body>
  <div style="position:fixed; top:1rem; right:1.25rem; display:flex; align-items:center; gap:1rem; font-size:.85rem; max-width:calc(100vw - 2.5rem); flex-wrap:wrap; justify-content:flex-end;">
    <span id="pages-remaining" style="display:none; color:var(--muted);"></span>
    <a id="my-pages-link" href="/my-pages.html" style="display:none; color:var(--muted); text-decoration:none;">Manage My Landing Pages</a>
    <a id="admin-link" href="/admin.html" style="display:none; color:var(--muted); text-decoration:none;">Admin</a>
    <a id="logout-link" href="#" style="display:none; color:var(--muted); text-decoration:none;">Log out</a>
  </div>

  <header>
    <h1>Find My Shop</h1>
    <p>Select an active listing to create a landing page.</p>
  </header>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const configRes = await fetch('/api/config');
    if (configRes.ok) {
      const { supabaseUrl, supabaseAnonKey } = await configRes.json();
      // Reads from either storage since "Remember me" on the login page may have
      // put the session in sessionStorage instead of the default localStorage.
      const supabase = createClient(supabaseUrl, supabaseAnonKey, {
        auth: {
          storage: {
            getItem: (key) => localStorage.getItem(key) ?? sessionStorage.getItem(key),
            setItem: (key, value) => localStorage.setItem(key, value),
            removeItem: (key) => { localStorage.removeItem(key); sessionStorage.removeItem(key); },
          },
        },
      });

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '/login.html';
      } else {
        // Exposed so the plain <script> below (app functionality) can attach
        // the session token to its API calls — the server now requires it.
        window.authedFetch = (url, options = {}) => fetch(url, {
          ...options,
          headers: { ...(options.headers || {}), Authorization: `Bearer ${session.access_token}` },
        });

        const logoutLink = document.getElementById('logout-link');
        logoutLink.style.display = 'block';
        document.getElementById('my-pages-link').style.display = 'block';
        logoutLink.addEventListener('click', async (e) => {
          e.preventDefault();
          await supabase.auth.signOut();
          window.location.href = '/login.html';
        });

        const { data: profile } = await supabase
          .from('profiles')
          .select('role, status, etsy_shop_name')
          .eq('id', session.user.id)
          .single();
        if (profile?.role === 'admin') {
          document.getElementById('admin-link').style.display = 'block';
        }

        function renderPurchaseScreen({ heading, message, showForm }) {
          document.body.innerHTML = `
            <div style="max-width:420px; margin:4rem auto; text-align:center; padding:0 1.5rem;
                        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
              <h1 style="margin-bottom:.5rem;">${heading}</h1>
              <p style="color:#6b6b6b;">${message}</p>
              ${showForm ? `
              <form id="verify-purchase-form">
                <input id="receipt-id-input" type="text" inputmode="numeric" placeholder="e.g. 1234567890" autocomplete="off"
                       style="width:100%; padding:.65rem .8rem; margin-bottom:.75rem; border:1px solid #eee2d6; border-radius:8px; font-size:1rem; box-sizing:border-box;" required />
                <button id="verify-purchase-submit" type="submit"
                        style="width:100%; padding:.75rem; border:none; border-radius:8px; background:#d5641c; color:white; font-size:1rem; cursor:pointer;">
                  Verify Purchase
                </button>
              </form>
              <p id="verify-purchase-message" style="min-height:1.3rem; margin-top:1rem; font-size:.9rem; color:#b3261e;"></p>
              ` : ''}
              <p><a id="pending-logout" href="#" style="color:#d5641c;">Log out</a></p>
            </div>`;
          document.getElementById('pending-logout').addEventListener('click', async (e) => {
            e.preventDefault();
            await supabase.auth.signOut();
            window.location.href = '/login.html';
          });
          if (!showForm) return;
          document.getElementById('verify-purchase-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('verify-purchase-submit');
            const messageEl = document.getElementById('verify-purchase-message');
            const receiptId = document.getElementById('receipt-id-input').value.trim();
            submitBtn.disabled = true;
            messageEl.textContent = '';
            try {
              // Re-fetch the session instead of reusing the one captured at page load --
              // that token may have expired if the buyer took a while to find their
              // order number, and supabase-js keeps a refreshed one ready in storage.
              const { data: { session: freshSession } } = await supabase.auth.getSession();
              if (!freshSession) {
                messageEl.textContent = 'Your session expired — please log in again.';
                submitBtn.disabled = false;
                return;
              }
              const verifyRes = await fetch('/api/verify-purchase', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${freshSession.access_token}` },
                body: JSON.stringify({ receiptId }),
              });
              const verifyData = await verifyRes.json();
              if (!verifyRes.ok) {
                if (verifyRes.status === 404) {
                  messageEl.innerHTML = `
                    <div style="text-align:left; color:#6b6b6b;">
                      <p style="font-weight:600; color:#222; margin:0 0 .4rem;">Order Not Found</p>
                      <p style="margin:0 0 .75rem;">This order number doesn't match a LaunchNestAI purchase. Double-check it against your Etsy confirmation.</p>
                      <p style="margin:0 0 .75rem;">Haven't purchased yet? <a href="https://www.etsy.com/listing/4569723339/ai-landing-page-marketing-template-pdf" target="_blank" rel="noopener noreferrer" style="color:#d5641c;">Get it on Etsy</a>.</p>
                      <p style="margin:0;">Still stuck? Contact us via <a href="https://www.etsy.com/shop/LaunchNestAI" target="_blank" rel="noopener noreferrer" style="color:#d5641c;">Etsy Messages</a>.</p>
                    </div>`;
                } else {
                  messageEl.textContent = verifyData.error || 'Something went wrong. Please try again.';
                }
                submitBtn.disabled = false;
                return;
              }
              window.location.reload();
            } catch {
              messageEl.textContent = 'Something went wrong. Please try again.';
              submitBtn.disabled = false;
            }
          });
        }

        // Approved non-admins with zero pages left get sent to their existing
        // pages instead of the shop search -- only checked here (not for
        // admins/not-yet-approved accounts), so skip the RPC call entirely
        // when its result can't affect the branch.
        let pagesRemaining = null;
        if (profile?.role !== 'admin' && profile?.status === 'approved') {
          // Silently pick up a repurchase made directly on Etsy (not via the
          // "buy more" link on My Landing Pages, which is the only other
          // place this ever got checked) -- a no-op if there's no new
          // receipt, so safe to call on every load. Awaited before computing
          // pagesRemaining so a page this call just granted is reflected
          // immediately instead of only on the next visit.
          try {
            await authedFetch('/api/check-new-purchase', { method: 'POST' });
          } catch {
            // Best-effort -- the manual order-number form on My Landing Pages
            // still works if this fails.
          }

          const { data: allowanceData } = await supabase.rpc('create_landing_page_allowed', {
            p_user_id: session.user.id,
          });
          pagesRemaining = allowanceData?.[0]?.remaining ?? null;
        }

        if (profile?.role !== 'admin' && profile?.status === 'declined') {
          renderPurchaseScreen({
            heading: 'Account access declined',
            message: 'Access declined. Contact support if this is a mistake.',
            showForm: false,
          });
        } else if (profile?.role !== 'admin' && profile?.status !== 'approved') {
          renderPurchaseScreen({
            heading: 'Order Number',
            message: 'Enter your Etsy order number to verify your purchase.',
            showForm: true,
          });
        } else if (profile?.role !== 'admin' && pagesRemaining === 0) {
          window.location.href = '/my-pages.html';
        } else {
          // Exposed so the plain <script> below can check the page allowance
          // (create_landing_page_allowed RPC).
          window.supabaseClient = supabase;
          window.currentUserId = session.user.id;

          // Non-admins are restricted to the one shop an admin assigned them
          // (real enforcement is server-side; this just reflects it in the UI
          // so there's nothing confusing to click). Admins keep free search.
          if (profile?.role !== 'admin') {
            window.shopSearchRestricted = true;
            const shopInputEl = document.getElementById('shop-input');
            if (!profile?.etsy_shop_name) {
              document.querySelector('.search-bar').style.display = 'none';
              document.getElementById('status').textContent =
                "Your account isn't linked to a shop yet — contact support.";
            } else {
              shopInputEl.value = profile.etsy_shop_name;
              shopInputEl.readOnly = true;
            }
          }

          window.refreshPagesRemaining = async () => {
            const { data, error } = await supabase.rpc('create_landing_page_allowed', {
              p_user_id: session.user.id,
            });
            const pagesRemainingEl = document.getElementById('pages-remaining');
            if (error || !data?.[0]) return;
            const { remaining } = data[0];
            pagesRemainingEl.textContent = remaining === null ? 'Unlimited pages' : `${remaining} page(s) left`;
            pagesRemainingEl.style.display = 'block';
          };
          window.refreshPagesRemaining();
        }
      }
    }
  </script>

  <div class="search-bar">
    <input id="shop-input" type="text" placeholder="e.g. YarnCraftCo" />
    <button id="search-btn">Search</button>
    <span class="change-shop-link" id="change-shop-link">Change shop</span>
  </div>

  <p id="status"></p>
  <div id="shop-info"></div>

  <div class="listing-picker" id="listing-picker">
    <div class="picker-row">
      <div class="picker-field" id="listing-field">
        <label for="listing-select">Product</label>
        <select id="listing-select">
          <option value="">Select a listing to see full details…</option>
        </select>
      </div>
    </div>
  </div>

  <div id="detail"></div>

  <div class="grid" id="grid"></div>

  <script>
    const input = document.getElementById('shop-input');
    const btn = document.getElementById('search-btn');
    const changeShopLink = document.getElementById('change-shop-link');
    const status = document.getElementById('status');
    const shopInfo = document.getElementById('shop-info');
    const grid = document.getElementById('grid');
    const listingPicker = document.getElementById('listing-picker');
    const listingSelect = document.getElementById('listing-select');
    const detail = document.getElementById('detail');
    let currentListing = null;
    let currentListingId = null;

    async function search() {
      const shopName = input.value.trim();
      if (!shopName) return;

      btn.disabled = true;
      status.textContent = `Loading listings for "${shopName}"…`;
      shopInfo.innerHTML = '';
      grid.innerHTML = '';
      detail.style.display = 'none';
      detail.innerHTML = '';
      listingPicker.style.display = 'none';
      listingSelect.innerHTML = '<option value="">Select a listing to see full details…</option>';

      try {
        const res = await authedFetch(`/api/shop/${encodeURIComponent(shopName)}`);
        const data = await res.json();

        if (!res.ok) {
          // A 404 on a restricted (locked, pre-filled) shop field means the
          // shop name stored on this account doesn't exist on Etsy at all --
          // most likely a typo made at checkout, not something they can fix
          // by retyping (the field is read-only). An admin's free-typed
          // search getting the same 404 is just a live typo, so it keeps the
          // plain message instead.
          if (res.status === 404 && window.shopSearchRestricted) {
            status.innerHTML = `We couldn't find an Etsy shop matching the name on your account ("${escapeHtml(shopName)}"). Contact us via <a href="https://www.etsy.com/shop/LaunchNestAI" target="_blank" rel="noopener noreferrer" style="color:var(--accent);">Etsy Messages</a> to fix it.`;
          } else {
            status.textContent = data.error || 'Something went wrong.';
          }
          return;
        }

        // Etsy's own shop summary can say there's an active listing while its
        // separate /listings/active search index hasn't caught up yet -- when
        // that happens, say so instead of implying the shop has no listings.
        if (data.listings.length === 0 && data.shop.etsyReportedActiveCount > 0) {
          status.textContent = "Your listing hasn't appeared in Etsy's search index yet. Try again in a few minutes.";
        } else {
          status.textContent = `${data.listings.length} active listing(s) found.`;
        }

        // Lock the field to the shop's official name (Etsy's casing may differ
        // from what was typed) so it can't be edited mid-session by accident.
        input.value = data.shop.name;
        input.readOnly = true;
        if (!window.shopSearchRestricted) changeShopLink.style.display = 'inline';

        shopInfo.innerHTML = `
          ${data.shop.icon ? `<img src="${data.shop.icon}" alt="${data.shop.name}" />` : ''}
          <h2>${data.shop.title || data.shop.name}</h2>
          <span>@${data.shop.name}</span>
        `;

        grid.innerHTML = data.listings.map(listing => `
          <div class="card">
            <button type="button" class="card-select" data-listing-id="${listing.id}">
              <img src="${listing.image || ''}" alt="${escapeHtml(listing.title)}" loading="lazy" />
              <div class="body">
                <p class="title">${escapeHtml(listing.title)}</p>
                <div class="price">${listing.price ? `$${listing.price} ${listing.currency}` : ''}</div>
                <div class="qty">${listing.quantity} in stock</div>
              </div>
            </button>
          </div>
        `).join('');

        if (data.listings.length) {
          listingPicker.style.display = 'block';
          for (const listing of data.listings) {
            const opt = document.createElement('option');
            opt.value = listing.id;
            opt.textContent = listing.title;
            listingSelect.appendChild(opt);
          }
        }
      } catch (err) {
        status.textContent = 'Failed to reach the server: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function showListingDetail(listingId) {
      if (!listingId) {
        detail.style.display = 'none';
        detail.innerHTML = '';
        return;
      }

      detail.style.display = 'block';
      detail.innerHTML = '<div class="panel">Loading listing details…</div>';

      try {
        const res = await authedFetch(`/api/listing/${listingId}`);
        const listing = await res.json();

        if (!res.ok) {
          detail.innerHTML = `<div class="panel">${escapeHtml(listing.error || 'Failed to load listing.')}</div>`;
          return;
        }

        currentListing = listing;
        currentListingId = listingId;
        detail.innerHTML = renderListingDetail(listing);
        document.getElementById('create-landing-btn').addEventListener('click', () => createLandingPage());
      } catch (err) {
        detail.innerHTML = `<div class="panel">Failed to reach the server: ${escapeHtml(err.message)}</div>`;
      }
    }

    function renderListingDetail(l) {
      const images = (l.images || []).map(img => `
        <img src="${img.url_570xN || img.url_fullxfull || ''}" alt="" loading="lazy" />
      `).join('');

      return `
        <div class="panel">
          <h2>${escapeHtml(l.title)}</h2>
          <div class="detail-actions">
            <a class="detail-url" href="${l.url}" target="_blank" rel="noopener noreferrer">View on Etsy →</a>
            <button id="create-landing-btn" class="landing-btn">✦ Create Landing Page</button>
          </div>

          ${images ? `<div class="images">${images}</div>` : ''}

          <div class="description">${escapeHtml(l.description || 'No description.')}</div>
        </div>
      `;
    }

    // prewarmedTab lets a caller that already had to await something before
    // this (e.g. the grid click handler below, which loads the listing
    // first) hand off a tab it opened synchronously in its own click
    // handler, since opening one here would be too late to dodge the popup
    // blocker in that case.
    async function createLandingPage(prewarmedTab) {
      if (!currentListing || !currentListingId) { prewarmedTab?.close(); return; }
      const btn = document.getElementById('create-landing-btn');
      const originalLabel = btn.textContent;
      // Snapshot the listing id this click belongs to, rather than re-reading
      // the ambient currentListingId global after the awaited fetch below --
      // if the user switches to a different listing while this request is in
      // flight, currentListingId gets overwritten and would point the
      // request at the wrong listing.
      const listingIdForRequest = currentListingId;

      const { data: allowance, error: allowanceError } = await window.supabaseClient.rpc(
        'create_landing_page_allowed',
        { p_user_id: window.currentUserId },
      );
      if (allowanceError) {
        status.textContent = 'Could not check your page allowance: ' + allowanceError.message;
        prewarmedTab?.close();
        return;
      }
      if (!allowance?.[0]?.allowed) {
        status.innerHTML = 'Page limit reached — purchase again for 3 more. <a href="/my-pages.html" style="color:var(--accent);">Go to Manage My Landing Pages</a>';
        prewarmedTab?.close();
        return;
      }

      // Open the tab synchronously, in direct response to the click — opening
      // it after the awaited fetch below would get blocked as a popup.
      const newTab = prewarmedTab ?? window.open('', '_blank');
      if (!newTab) {
        alert('Please allow pop-ups for this site to open the landing page in a new tab.');
        return;
      }
      newTab.document.write('<!DOCTYPE html><title>Loading…</title><body style="font-family:sans-serif;padding:2rem;color:#57534A;">Writing your landing page, please be patient. This could take a minute.</body>');
      newTab.document.close();

      btn.disabled = true;
      btn.textContent = 'Writing your landing page…';

      try {
        const res = await authedFetch('/api/landing-pages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ listingId: listingIdForRequest }),
        });
        const data = await res.json();

        if (!res.ok) {
          newTab.document.body.textContent = data.error || 'Failed to create landing page.';
          return;
        }

        newTab.location.href = data.url;
        window.refreshPagesRemaining();
      } catch (err) {
        newTab.document.body.textContent = 'Failed to reach the server: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = originalLabel;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function resetShopSearch() {
      input.value = '';
      input.readOnly = false;
      changeShopLink.style.display = 'none';
      status.textContent = '';
      shopInfo.innerHTML = '';
      grid.innerHTML = '';
      detail.style.display = 'none';
      detail.innerHTML = '';
      listingPicker.style.display = 'none';
      input.focus();
    }

    btn.addEventListener('click', search);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
    changeShopLink.addEventListener('click', resetShopSearch);
    listingSelect.addEventListener('change', e => showListingDetail(e.target.value));
    // Clicking a card creates the landing page directly -- the same as
    // picking the listing from the dropdown and then clicking Create Landing
    // Page, just combined into one click. Previously this opened the listing
    // on Etsy instead. Delegated on the grid since its cards are replaced
    // wholesale on every search.
    grid.addEventListener('click', async e => {
      const card = e.target.closest('.card-select');
      if (!card) return;
      const listingId = card.dataset.listingId;
      listingSelect.value = listingId;

      // Opened synchronously, in direct response to the click, and handed
      // off to createLandingPage below -- this handler has to load the
      // listing first (unlike the Create Landing Page button, which only
      // runs once a listing is already loaded), and opening the tab after
      // that await would get it blocked as a popup.
      const newTab = window.open('', '_blank');
      if (!newTab) {
        alert('Please allow pop-ups for this site to open the landing page in a new tab.');
        return;
      }
      newTab.document.write('<!DOCTYPE html><title>Loading…</title><body style="font-family:sans-serif;padding:2rem;color:#57534A;">Loading…</body>');
      newTab.document.close();

      await showListingDetail(listingId);
      if (currentListingId === listingId) {
        await createLandingPage(newTab);
      } else {
        newTab.close();
      }
    });
  </script>
</body>
</html>
