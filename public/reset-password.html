<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password · Etsy Shop Viewer</title>
<style>
  :root {
    --bg: #fdfaf6;
    --ink: #222;
    --muted: #6b6b6b;
    --accent: #d5641c;
    --card-bg: #ffffff;
    --border: #eee2d6;
    --error: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .card {
    width: 100%;
    max-width: 380px;
    margin: 2rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 2rem;
  }
  h1 {
    margin: 0 0 .25rem;
    font-size: 1.5rem;
  }
  p.subtitle {
    margin: 0 0 1.5rem;
    color: var(--muted);
  }
  label {
    display: block;
    font-size: .85rem;
    margin: 0 0 .3rem;
  }
  input {
    width: 100%;
    padding: .65rem .8rem;
    margin-bottom: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
  }
  button {
    width: 100%;
    padding: .75rem;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: .6;
    cursor: not-allowed;
  }
  #message {
    min-height: 1.3rem;
    margin-top: 1rem;
    font-size: .9rem;
    text-align: center;
  }
  #message.error { color: var(--error); }
  #message.success { color: #1a7a35; }
</style>
</head>
<body>
  <div class="card">
    <h1>Set a new password</h1>
    <p class="subtitle" id="subtitle">Choose a new password for your account.</p>

    <form id="reset-form">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="6" required />

      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="6" required />

      <button id="submit-btn" type="submit">Update Password</button>
    </form>

    <p id="message"></p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const message = document.getElementById('message');
    const subtitle = document.getElementById('subtitle');

    function showMessage(text, kind) {
      message.textContent = text;
      message.className = kind;
    }

    async function init() {
      const configRes = await fetch('/api/config');
      if (!configRes.ok) {
        showMessage('Password reset is not available right now — the site is missing its Supabase configuration.', 'error');
        submitBtn.disabled = true;
        return;
      }
      const { supabaseUrl, supabaseAnonKey } = await configRes.json();
      const supabase = createClient(supabaseUrl, supabaseAnonKey);

      // Clicking the emailed reset link logs the visitor in with a temporary
      // session (parsed from the URL by supabase-js) — that's what lets them
      // set a new password without knowing the old one.
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        subtitle.textContent = '';
        showMessage('This reset link is invalid or has expired. Request a new one from the login page.', 'error');
        form.style.display = 'none';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (password !== confirm) {
          showMessage('Passwords do not match.', 'error');
          return;
        }

        submitBtn.disabled = true;
        showMessage('Updating password…', '');

        const { error } = await supabase.auth.updateUser({ password });
        if (error) {
          showMessage(error.message, 'error');
          submitBtn.disabled = false;
          return;
        }

        showMessage('Password updated! Redirecting…', 'success');
        setTimeout(() => { window.location.href = '/'; }, 1200);
      });
    }

    init();
  </script>
</body>
</html>
